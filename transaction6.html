<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --accent:#0f766e; --accent-dark:#0e6b63; --danger:#e11d48; --danger-bg:#fff1f2;
    --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#92400e;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:900px; margin:0 auto; padding:28px 16px 60px; }
  .headline{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  h1{ font-family:'Noto Serif KR', serif; font-size:1.6rem; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:0.9rem; margin:0 0 20px; }
  .visit-line{ color:#94a3b8; font-size:0.78rem; margin:-14px 0 20px; }
  .auth-box{ font-size:0.8rem; text-align:right; }
  .auth-box a{ color:var(--accent); cursor:pointer; text-decoration:underline; }
  .admin-badge{ display:inline-block; background:var(--accent); color:#fff; font-size:0.72rem; padding:2px 10px; border-radius:999px; margin-right:8px; }

  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tab{ border:1px solid transparent; border-bottom:none; background:#e2e8f0; color:var(--muted);
    padding:10px 18px; font-size:0.9rem; font-weight:500; border-radius:8px 8px 0 0; cursor:pointer; }
  .tab.active{ background:#fff; color:var(--accent); border-color:var(--line); }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:0 8px 8px 8px; padding:22px; }
  .panel > p.desc{ color:var(--muted); font-size:0.88rem; margin-top:0; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .grid2{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  .field input, .field select{ width:100%; padding:9px 11px; font-size:0.9rem; border:1px solid #cbd5e1;
    border-radius:6px; color:var(--ink); font-family:inherit; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(15,118,110,0.15); }
  .span2{ grid-column:1/-1; }

  .btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:6px; padding:10px 18px;
    font-size:0.88rem; font-weight:500; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-primary:disabled{ background:#94a3b8; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid #cbd5e1; color:var(--muted); }
  .btn-ghost:hover{ background:#f1f5f9; }
  .btn-link{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.88rem; padding:0; font-family:inherit; }
  .btn-icon{ background:none; border:none; cursor:pointer; padding:5px; border-radius:5px; color:var(--muted); }
  .btn-icon:hover{ background:#f1f5f9; }
  .btn-icon.danger{ color:var(--danger); }
  .btn-icon.danger:hover{ background:var(--danger-bg); }

  .flash{ color:var(--accent); font-size:0.85rem; margin-left:10px; }
  .error{ color:var(--danger); background:var(--danger-bg); padding:8px 12px; border-radius:6px; font-size:0.85rem; margin-top:10px; }
  .badge{ display:inline-block; font-size:0.72rem; background:var(--accent); color:#fff; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }

  .box{ background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px; }
  .box h3{ font-size:0.9rem; margin:0 0 12px; }

  ul.partner-list{ list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  ul.partner-list li{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid var(--line); }
  ul.partner-list li:last-child{ border-bottom:none; }
  .p-name{ font-weight:500; }
  .p-meta{ display:flex; flex-wrap:wrap; gap:2px 14px; color:var(--muted); font-size:0.78rem; margin-top:3px; }
  .empty-msg{ text-align:center; color:#94a3b8; border:1px dashed #cbd5e1; border-radius:8px; padding:24px; font-size:0.88rem; }

  table.items{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  table.items th{ background:#f1f5f9; color:var(--muted); font-size:0.75rem; text-align:left; padding:8px 6px; }
  table.items td{ padding:6px; border-top:1px solid var(--line); }
  table.items input{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; font-size:0.85rem; font-family:inherit; }
  table.items input:focus{ outline:none; border-color:var(--accent); }
  .num{ text-align:right; }
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table.items tfoot td{ background:#f8fafc; font-weight:700; }

  table.preview{ width:100%; border-collapse:collapse; font-size:0.78rem; margin-top:10px; }
  table.preview th, table.preview td{ border:1px solid var(--line); padding:5px 7px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
  table.preview th{ background:#f1f5f9; }

  .partner-info{ background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:8px 12px; font-size:0.8rem; color:var(--muted); margin-top:10px; }
  footer.note{ text-align:center; color:#94a3b8; font-size:0.75rem; margin-top:18px; }

  .setup-box{ background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink); border-radius:10px; padding:20px 22px; }
  .setup-box h2{ margin-top:0; font-size:1.15rem; }
  .setup-box ol{ padding-left:20px; }
  .setup-box li{ margin-bottom:10px; line-height:1.5; }
  .setup-box code, .setup-box pre{ background:#fff; border:1px solid var(--warn-line); border-radius:6px; padding:2px 6px; font-size:0.82rem; }
  .setup-box pre{ padding:12px; overflow-x:auto; white-space:pre; }
  .copy-btn{ margin-top:6px; }

  .login-panel{ max-width:340px; }
  .checkline{ display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--muted); margin:10px 0; }
  .type-box{ margin-bottom:14px; background:#f1f5f9; padding:10px 14px; border-radius:6px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .type-box label{ font-size:0.88rem; cursor:pointer; }
</style>
</head>

function won(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
function newItem(){ return { id: Date.now()+Math.random(), name:"", spec:"", qty:1, price:0, note:"" }; }
function emptyForm(){ return { name:"", biz:"", ceo:"", phone:"", address:"" }; }
function normalizeDrugName(s){ return (s||"").trim().replace(/\s+/g," "); }

if(!isConfigured){
  document.getElementById("app").innerHTML = `
    <div class="setup-box">
      <h2>Firebase 연결이 아직 설정되지 않았어요</h2>
      <p>여러 약사님이 함께 쓰는 목록을 저장하려면, 무료 Firebase 프로젝트를 한 번만 만들어 연결해야 합니다.</p>
      <ol>
        <li><a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> 접속 → 프로젝트 추가</li>
        <li><strong>빌드 → Firestore Database</strong> 만들기</li>
        <li>Firestore <strong>규칙(Rules)</strong>에 아래 내용 붙여넣고 게시:
          <pre id="rules-text">${FIRESTORE_RULES}</pre>
          <button class="btn btn-ghost copy-btn" id="copy-rules">규칙 복사하기</button>
        </li>
        <li><strong>Authentication</strong>에서 이메일/비밀번호 로그인 켜고 관리자 계정 1개 생성</li>
        <li>프로젝트 설정 → 웹 앱 등록 → firebaseConfig 값을 이 파일 상단에 붙여넣기</li>
      </ol>
    </div>
  `;
  const copyBtn = document.getElementById("copy-rules");
  if(copyBtn) copyBtn.addEventListener("click", ()=>{
    navigator.clipboard.writeText(FIRESTORE_RULES).then(()=>{
      copyBtn.textContent = "복사됨!";
      setTimeout(()=>{ copyBtn.textContent = "규칙 복사하기"; }, 1500);
    });
  });
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  /* 방문 카운터: 페이지가 열릴 때마다 1씩 증가시키고, 누적 값을 실시간으로 보여줍니다. */
  const visitRef = db.collection("stats").doc("visits");
  visitRef.set({ count: firebase.firestore.FieldValue.increment(1) }, { merge:true }).catch(()=>{});
  visitRef.onSnapshot(
    doc => {
      const el = document.getElementById("visit-count");
      if(el && doc.exists) el.textContent = `누적 방문 ${Number(doc.data().count||0).toLocaleString("ko-KR")}회`;
    },
    ()=>{}
  );

  let drugPriceMap = {};
  let drugPriceCount = 0;
  let drugDataStatus = "checking";

  function buildDrugDatalist(){
    let dl = document.getElementById("drug-datalist");
    if(!dl){ dl = document.createElement("datalist"); dl.id = "drug-datalist"; document.body.appendChild(dl); }
    dl.innerHTML = Object.keys(drugPriceMap).map(n => `<option value="${esc(n)}">`).join("");
  }

  function buildPharmacyDatalist(){
    let dl = document.getElementById("pharmacy-datalist");
    if(!dl){ dl = document.createElement("datalist"); dl.id = "pharmacy-datalist"; document.body.appendChild(dl); }
    dl.innerHTML = sortedPharmacies().map(p => `<option value="${esc(p.name)}">`).join("");
  }

  fetch("./drug_prices.json")
    .then(res => { if(!res.ok) throw new Error("not found"); return res.json(); })
    .then(list => {
      if(!Array.isArray(list)) throw new Error("invalid");
      list.forEach(row=>{
        const name = normalizeDrugName(row.name);
        const price = Number(row.price);
        if(name && !isNaN(price)) drugPriceMap[name] = price;
      });
      drugPriceCount = Object.keys(drugPriceMap).length;
      drugDataStatus = drugPriceCount > 0 ? "ok" : "missing";
      buildDrugDatalist();
      if(state.activeTab === "transaction") render();
    })
    .catch(()=>{ drugDataStatus = "missing"; if(state.activeTab === "transaction") render(); });

  let state = {
    activeTab: "mine",
    pharmacies: [],
    loading: true,
    connError: "",
    myPharmacyId: localStorage.getItem("myPharmacyId") || "",
    editingId: null,
    form: emptyForm(),
    formError: "",
    txDate: new Date().toISOString().slice(0,10),
    txType: "supply",
    selectedPartnerId: "",
    items: [newItem()],
    txNote: "",
    txError: "",

    isAdmin: false,
    authChecked: false,
    showLoginForm: false,
    loginError: "",

    bulkRows: [],
    bulkHeaders: [],
    bulkMapping: { name:"", phone:"", biz:"", ceo:"", address:"" },
    bulkSkipDup: true,
    bulkReplaceAll: false,
    bulkStatus: ""
  };

  auth.onAuthStateChanged(user => {
    state.isAdmin = !!user;
    state.authChecked = true;
    state.showLoginForm = false;
    if(!state.isAdmin && state.activeTab === "directory") state.activeTab = "mine";
    renderAuthBox();
    render();
  });

  db.collection("pharmacies").onSnapshot(
    snap => {
      state.pharmacies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.loading = false;
      state.connError = "";
      buildPharmacyDatalist();
      render();
    },
    err => {
      state.loading = false;
      state.connError = "공용 목록을 불러오지 못했습니다. Firestore 보안 규칙을 확인해 주세요. (" + err.message + ")";
      render();
    }
  );

  function renderAuthBox(){
    const el = document.getElementById("auth-box");
    if(!el) return;
    if(state.isAdmin){
      el.innerHTML = `<span class="admin-badge">관리자 모드</span><a id="logout-link">로그아웃</a>`;
      const l = document.getElementById("logout-link");
      if(l) l.addEventListener("click", ()=> auth.signOut());
    } else {
      el.innerHTML = `<a id="login-link">관리자 로그인</a>`;
      const l = document.getElementById("login-link");
      if(l) l.addEventListener("click", ()=>{ state.showLoginForm = true; state.activeTab = "directory"; render(); });
    }
  }

  function render(){
    renderAuthBox();
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="tabs">
        ${state.isAdmin ? `<button class="tab ${state.activeTab==='directory'?'active':''}" data-tab="directory">약국 디렉토리 (공용)</button>` : ""}
        <button class="tab ${state.activeTab==='mine'?'active':''}" data-tab="mine">내 약국 설정</button>
        <button class="tab ${state.activeTab==='transaction'?'active':''}" data-tab="transaction">거래명세서 작성</button>
      </div>
      <div class="panel">
        ${state.connError ? `<div class="error">${esc(state.connError)}</div>` : ""}
        ${state.loading ? `<p style="color:#94a3b8; font-size:0.88rem;">불러오는 중...</p>` : renderTab()}
      </div>
    `;
    document.querySelectorAll(".tab").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.activeTab = btn.dataset.tab; render(); });
    });
    if(!state.loading) attachTabListeners();
  }

  function renderTab(){
    if(state.activeTab === "directory") return renderDirectory();
    if(state.activeTab === "mine") return renderMine();
    return renderTransaction();
  }

  function renderLoginForm(){
    return `
      <div class="box login-panel">
        <h3>관리자 로그인</h3>
        <div class="field" style="margin-bottom:10px;"><label>이메일</label><input id="login-email" type="email" placeholder="admin@example.com"></div>
        <div class="field" style="margin-bottom:10px;"><label>비밀번호</label><input id="login-pw" type="password"></div>
        ${state.loginError ? `<div class="error">${esc(state.loginError)}</div>` : ""}
        <div style="margin-top:10px; display:flex; gap:8px;">
          <button class="btn btn-primary" id="login-submit">로그인</button>
          <button class="btn btn-ghost" id="login-cancel">취소</button>
        </div>
      </div>
    `;
  }

  function sortedPharmacies(){
    return [...state.pharmacies].sort((a,b)=> (a.name||"").localeCompare((b.name||""), "ko"));
  }

  function renderDirectory(){
    const f = state.form;
    const listData = sortedPharmacies();
    const list = listData.length === 0
      ? `<p class="empty-msg">아직 등록된 약국이 없습니다.</p>`
      : `<ul class="partner-list">${listData.map(p => `
          <li>
            <div>
              <div class="p-name">${esc(p.name)}${p.id === state.myPharmacyId ? '<span class="badge">내 약국</span>' : ""}</div>
              <div class="p-meta">
                ${p.ceo?`<span>대표자 ${esc(p.ceo)}</span>`:""}
                ${p.phone?`<span>전화 ${esc(p.phone)}</span>`:""}
                ${p.address?`<span>${esc(p.address)}</span>`:""}
                ${p.biz?`<span>사업자 ${esc(p.biz)}</span>`:""}
              </div>
            </div>
            ${state.isAdmin ? `
            <div style="display:flex; gap:2px; flex-shrink:0;">
              <button class="btn-icon" data-edit="${p.id}" title="수정">✎</button>
              <button class="btn-icon danger" data-delete="${p.id}" title="삭제">✕</button>
            </div>` : ""}
          </li>`).join("")}</ul>`;

    if(!state.isAdmin){
      return `
        <p class="desc">약국 목록 관리는 관리자만 할 수 있습니다.</p>
        ${state.showLoginForm ? renderLoginForm() : `<p style="font-size:0.85rem;"><a id="open-login" class="btn-link">관리자로 로그인하기</a></p>`}
      `;
    }

    return `
      <p class="desc">여기 등록된 약국은 참여하는 모든 약사님 화면에 실시간으로 공유됩니다.</p>
      <div class="box">
        <h3>${state.editingId ? "약국 정보 수정" : "새 약국 등록"}</h3>
        <div class="grid2">
          <div class="field"><label>약국명 (상호) *</label><input id="f-name" value="${esc(f.name)}" placeholder="예: 행복약국"></div>
          <div class="field"><label>사업자등록번호</label><input id="f-biz" value="${esc(f.biz)}" placeholder="000-00-00000"></div>
          <div class="field"><label>대표자(약사)</label><input id="f-ceo" value="${esc(f.ceo)}" placeholder="대표 약사님 성함"></div>
          <div class="field"><label>전화번호</label><input id="f-phone" value="${esc(f.phone)}" placeholder="02-000-0000"></div>
          <div class="field span2"><label>주소</label><input id="f-address" value="${esc(f.address)}" placeholder="약국 주소"></div>
        </div>
        ${state.formError ? `<div class="error">${esc(state.formError)}</div>` : ""}
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn btn-primary" id="submit-form">${state.editingId ? "수정 완료" : "약국 등록"}</button>
          ${state.editingId ? `<button class="btn btn-ghost" id="cancel-edit">취소</button>` : ""}
        </div>
      </div>

      <div class="box">
        <h3>엑셀로 일괄 등록</h3>
        <p style="font-size:0.82rem; color:var(--muted); margin-top:0;">보유하신 약국 명단 엑셀 파일을 한 번에 등록합니다. 파일에 헤더(첫 줄에 열 이름)가 있어야 합니다.</p>
        <input type="file" id="bulk-file" accept=".xlsx,.xls,.csv">
        ${state.bulkHeaders.length > 0 ? renderBulkMapping() : ""}
        ${state.bulkStatus ? `<p style="font-size:0.85rem; margin-top:10px; color:var(--accent);">${esc(state.bulkStatus)}</p>` : ""}
      </div>

      <h3 style="font-size:0.9rem; margin-bottom:8px;">등록된 약국 (${state.pharmacies.length})</h3>
      ${list}
    `;
  }

  function renderBulkMapping(){
    const h = state.bulkHeaders;
    const m = state.bulkMapping;
    const opt = (val) => `<option value="">(선택 안 함)</option>` + h.map(x=>`<option value="${esc(x)}" ${x===val?"selected":""}>${esc(x)}</option>`).join("");
    const sample = state.bulkRows.slice(0,5);
    return `
      <div class="grid2" style="margin-top:14px;">
        <div class="field"><label>약국명 열 *</label><select id="map-name">${opt(m.name)}</select></div>
        <div class="field"><label>전화번호 열</label><select id="map-phone">${opt(m.phone)}</select></div>
        <div class="field"><label>사업자등록번호 열</label><select id="map-biz">${opt(m.biz)}</select></div>
        <div class="field"><label>약사(대표자) 열</label><select id="map-ceo">${opt(m.ceo)}</select></div>
        <div class="field span2"><label>주소 열</label><select id="map-address">${opt(m.address)}</select></div>
      </div>
      <table class="preview">
        <thead><tr><th>약국명</th><th>전화번호</th><th>사업자등록번호</th><th>약사</th><th>주소</th></tr></thead>
        <tbody>${sample.map(r=>`<tr>
          <td>${esc(r[m.name]||"")}</td><td>${esc(r[m.phone]||"")}</td><td>${esc(r[m.biz]||"")}</td><td>${esc(r[m.ceo]||"")}</td><td>${esc(r[m.address]||"")}</td>
        </tr>`).join("")}</tbody>
      </table>
      <div class="checkline">
        <input type="checkbox" id="bulk-replace-all" ${state.bulkReplaceAll?"checked":""}>
        <label for="bulk-replace-all" style="margin:0; color:#e11d48; font-weight:600;">기존 등록된 약국을 모두 삭제하고, 이 파일 내용으로 전체 교체 (되돌릴 수 없음)</label>
      </div>
      <div class="checkline" style="${state.bulkReplaceAll ? "opacity:0.4;" : ""}">
        <input type="checkbox" id="bulk-skip-dup" ${state.bulkSkipDup?"checked":""} ${state.bulkReplaceAll?"disabled":""}>
        <label for="bulk-skip-dup" style="margin:0;">이미 등록된 약국명은 건너뛰기</label>
      </div>
      <button class="btn btn-primary" id="bulk-submit">${state.bulkReplaceAll ? `${state.bulkRows.length.toLocaleString("ko-KR")}건으로 전체 교체` : `${state.bulkRows.length.toLocaleString("ko-KR")}건 일괄 등록`}</button>
    `;
  }

  function renderMine(){
    const mine = state.pharmacies.find(p => p.id === state.myPharmacyId);
    return `
      <p class="desc">디렉토리에 등록된 약국 중, 어떤 것이 우리 약국인지 선택해 두면 거래명세서 작성 시 자동으로 사용됩니다. 이 선택은 이 브라우저에만 저장됩니다.</p>
      ${state.pharmacies.length === 0
        ? `<p class="empty-msg">먼저 '약국 디렉토리' 탭에서 우리 약국이 등록되어 있는지 확인해 주세요.</p>`
        : `<div class="field" style="max-width:360px;">
             <label>내 약국 선택 (이름을 입력해서 찾으세요)</label>
             <input type="text" id="mine-input" list="pharmacy-datalist" autocomplete="off" value="${mine ? esc(mine.name) : ''}" placeholder="약국명 입력">
           </div>`}
      ${mine ? `<div class="partner-info" style="margin-top:14px;">현재 선택됨: <strong>${esc(mine.name)}</strong>${mine.phone?` · ${esc(mine.phone)}`:""}</div>` : ""}
    `;
  }

  function renderTransaction(){
    const mine = state.pharmacies.find(p => p.id === state.myPharmacyId);
    const partnerOptions = sortedPharmacies().filter(p => p.id !== state.myPharmacyId);
    const partner = partnerOptions.find(p => p.id === state.selectedPartnerId);
    const total = state.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
    if(!mine) return `<p class="empty-msg">먼저 '내 약국 설정' 탭에서 우리 약국을 선택해 주세요.</p>`;

    const isSupply = state.txType === "supply";
    const supplierPharm = isSupply ? mine : partner;
    const receiverPharm = isSupply ? partner : mine;

    const itemRows = state.items.map((it,idx)=>`
      <tr data-item="${it.id}">
        <td>${idx+1}</td>
        <td><input data-field="name" list="drug-datalist" autocomplete="off" value="${esc(it.name)}" placeholder="약품/물품명"></td>
        <td><input data-field="spec" value="${esc(it.spec)}"></td>
        <td><input data-field="qty" type="number" min="0" value="${it.qty}" style="text-align:right;"></td>
        <td><input data-field="price" type="number" min="0" value="${it.price}" style="text-align:right;"></td>
        <td class="num">${won((Number(it.qty)||0)*(Number(it.price)||0))}</td>
        <td style="text-align:center;"><button class="btn-icon danger" data-remove-item="${it.id}">✕</button></td>
      </tr>
    `).join("");

    return `
      <div class="type-box">
        <span style="font-size:0.85rem; font-weight:700;">거래 유형:</span>
        <label><input type="radio" name="tx-type" value="supply" ${isSupply?"checked":""}> 우리 약국이 공급 (매출/보냄)</label>
        <label><input type="radio" name="tx-type" value="receive" ${!isSupply?"checked":""}> 우리 약국이 공급받음 (매입/받음)</label>
      </div>
      <div class="partner-info" style="margin-bottom:16px;">
        공급자: <strong>${supplierPharm ? esc(supplierPharm.name) : "(선택 안 됨)"}</strong> &nbsp;|&nbsp; 공급받는자: <strong>${receiverPharm ? esc(receiverPharm.name) : "(선택 안 됨)"}</strong>
      </div>
      <div class="grid2">
        <div class="field"><label>거래일자</label><input type="date" id="tx-date" value="${state.txDate}"></div>
        <div class="field">
          <label>상대 약국 (${isSupply?"공급받는자":"공급자"})</label>
          ${partnerOptions.length === 0
            ? `<p style="font-size:0.8rem; color:#94a3b8; border:1px dashed #cbd5e1; border-radius:6px; padding:8px 10px; margin:0;">디렉토리에 다른 약국이 아직 없습니다.</p>`
            : `<input type="text" id="tx-partner-input" list="pharmacy-datalist" autocomplete="off" value="${partner ? esc(partner.name) : ''}" placeholder="약국명 입력">`}
        </div>
      </div>
      ${partner ? `<div class="partner-info">${partner.ceo?`대표자: ${esc(partner.ceo)} &nbsp; `:""}${partner.phone?`전화: ${esc(partner.phone)} &nbsp; `:""}${partner.address?`주소: ${esc(partner.address)}`:""}</div>` : ""}

      <h3 style="font-size:0.9rem; margin:22px 0 8px;">거래 품목</h3>
      <p style="font-size:0.78rem; color:${drugDataStatus==='ok' ? '#0f766e' : '#94a3b8'}; margin:0 0 8px;">
        ${drugDataStatus==='ok'
          ? `등록된 약가 데이터 ${drugPriceCount.toLocaleString('ko-KR')}개 품목과 일치하는 제품명을 입력하면 단가가 자동으로 채워집니다.`
          : `약가 자동입력이 아직 연결되지 않았습니다.`}
      </p>
      <div class="table-scroll">
        <table class="items">
          <thead><tr><th style="width:28px;">#</th><th>품목명</th><th style="width:90px;">규격</th><th style="width:70px;">수량</th><th style="width:100px;">단가</th><th style="width:100px;">금액</th><th style="width:28px;"></th></tr></thead>
          <tbody>${itemRows}</tbody>
          <tfoot><tr><td colspan="5" style="text-align:right;">합계</td><td class="num" style="color:var(--accent);">${won(total)} 원</td><td></td></tr></tfoot>
        </table>
      </div>
      <button class="btn-link" id="add-item" style="margin-top:8px;">+ 품목 추가</button>
      <div class="field" style="margin-top:16px;"><label>비고 (선택)</label><input id="tx-note" value="${esc(state.txNote)}" placeholder="특이사항이 있으면 입력하세요"></div>
      ${state.txError ? `<div class="error">${esc(state.txError)}</div>` : ""}
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="export-excel">⬇ 엑셀 거래명세서 다운로드</button>
        <span class="flash" id="export-flash" style="display:none;">다운로드되었습니다.</span>
      </div>
    `;
  }

  function attachTabListeners(){
    const openLogin = document.getElementById("open-login");
    if(openLogin) openLogin.addEventListener("click", ()=>{ state.showLoginForm = true; render(); });
    const loginCancel = document.getElementById("login-cancel");
    if(loginCancel) loginCancel.addEventListener("click", ()=>{ state.showLoginForm = false; state.loginError=""; render(); });
    const loginSubmit = document.getElementById("login-submit");
    if(loginSubmit) loginSubmit.addEventListener("click", async ()=>{
      const email = document.getElementById("login-email").value.trim();
      const pw = document.getElementById("login-pw").value;
      try{
        await auth.signInWithEmailAndPassword(email, pw);
        state.loginError = "";
      }catch(e){
        state.loginError = "로그인에 실패했습니다. 이메일/비밀번호를 확인해 주세요.";
        render();
      }
    });

    if(state.activeTab === "directory" && state.isAdmin){
      document.getElementById("submit-form").addEventListener("click", async ()=>{
        const f = {
          name: document.getElementById("f-name").value.trim(),
          biz: document.getElementById("f-biz").value.trim(),
          ceo: document.getElementById("f-ceo").value.trim(),
          phone: document.getElementById("f-phone").value.trim(),
          address: document.getElementById("f-address").value.trim()
        };
        if(!f.name){ state.formError = "약국명(상호)은 필수입니다."; render(); return; }
        try{
          if(state.editingId){ await db.collection("pharmacies").doc(state.editingId).set(f, { merge:true }); }
          else{ await db.collection("pharmacies").add(f); }
          state.editingId = null; state.form = emptyForm(); state.formError = ""; render();
        }catch(e){ state.formError = "저장에 실패했습니다: " + e.message; render(); }
      });
      const cancelBtn = document.getElementById("cancel-edit");
      if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ state.editingId = null; state.form = emptyForm(); state.formError = ""; render(); });
      document.querySelectorAll("[data-edit]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const p = state.pharmacies.find(x=>x.id===btn.dataset.edit);
          state.editingId = p.id;
          state.form = { name:p.name||"", biz:p.biz||"", ceo:p.ceo||"", phone:p.phone||"", address:p.address||"" };
          render();
        });
      });
      document.querySelectorAll("[data-delete]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.dataset.delete;
          if(!confirm("이 약국 정보를 목록에서 삭제할까요?")) return;
          try{ await db.collection("pharmacies").doc(id).delete(); if(state.myPharmacyId===id){ state.myPharmacyId=""; localStorage.removeItem("myPharmacyId"); } }
          catch(e){ alert("삭제 실패: " + e.message); }
        });
      });
      ["f-name","f-biz","f-ceo","f-phone","f-address"].forEach(id=>{
        const el = document.getElementById(id);
        el.addEventListener("input", ()=>{ state.form[id.replace("f-","")] = el.value; });
      });

      const bulkFile = document.getElementById("bulk-file");
      if(bulkFile) bulkFile.addEventListener("change", (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{
          try{
            const data = new Uint8Array(ev.target.result);
            const wb = XLSX.read(data, { type: "array" });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            if(rows.length === 0) throw new Error("빈 파일입니다.");
            state.bulkRows = rows;
            state.bulkHeaders = Object.keys(rows[0]);
            const guess = (cands) => state.bulkHeaders.find(h => cands.some(c=>h.replace(/\s/g,"").includes(c))) || "";
            state.bulkMapping = {
              name: guess(["약국명","상호","약국"]),
              phone: guess(["전화","연락처"]),
              biz: guess(["사업자"]),
              ceo: guess(["약사","대표자","성명","이름"]),
              address: guess(["주소"])
            };
            state.bulkStatus = "";
            render();
          }catch(err){ alert("파일을 읽지 못했습니다: " + err.message); }
        };
        reader.readAsArrayBuffer(file);
      });
      ["map-name","map-phone","map-biz","map-ceo","map-address"].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.addEventListener("change", ()=>{ state.bulkMapping[id.replace("map-","")] = el.value; render(); });
      });
      const skipDup = document.getElementById("bulk-skip-dup");
      if(skipDup) skipDup.addEventListener("change", ()=>{ state.bulkSkipDup = skipDup.checked; });
      const replaceAll = document.getElementById("bulk-replace-all");
      if(replaceAll) replaceAll.addEventListener("change", ()=>{ state.bulkReplaceAll = replaceAll.checked; render(); });
      const bulkSubmit = document.getElementById("bulk-submit");
      if(bulkSubmit) bulkSubmit.addEventListener("click", runBulkImport);
    }

    if(state.activeTab === "mine"){
      const input = document.getElementById("mine-input");
      if(input) input.addEventListener("change", e=>{
        const match = state.pharmacies.find(p => (p.name||"").trim() === e.target.value.trim());
        if(match){
          state.myPharmacyId = match.id;
          localStorage.setItem("myPharmacyId", state.myPharmacyId);
        } else if(e.target.value.trim() === ""){
          state.myPharmacyId = "";
          localStorage.removeItem("myPharmacyId");
        }
        render();
      });
    }

    if(state.activeTab === "transaction"){
      const dateEl = document.getElementById("tx-date");
      if(dateEl) dateEl.addEventListener("change", e=>{ state.txDate = e.target.value; });
      const partnerInput = document.getElementById("tx-partner-input");
      if(partnerInput) partnerInput.addEventListener("change", e=>{
        const match = state.pharmacies.find(p => p.id !== state.myPharmacyId && (p.name||"").trim() === e.target.value.trim());
        state.selectedPartnerId = match ? match.id : (e.target.value.trim() === "" ? "" : state.selectedPartnerId);
        render();
      });
      const noteEl = document.getElementById("tx-note");
      if(noteEl) noteEl.addEventListener("input", e=>{ state.txNote = e.target.value; });
      const addBtn = document.getElementById("add-item");
      if(addBtn) addBtn.addEventListener("click", ()=>{ state.items.push(newItem()); render(); });
      document.querySelectorAll('input[name="tx-type"]').forEach(radio=>{
        radio.addEventListener("change", e=>{ state.txType = e.target.value; render(); });
      });
      document.querySelectorAll("[data-remove-item]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if(state.items.length === 1) return;
          state.items = state.items.filter(it => String(it.id) !== btn.dataset.removeItem);
          render();
        });
      });
      document.querySelectorAll("tr[data-item] input").forEach(input=>{
        input.addEventListener("input", ()=>{
          const row = input.closest("tr");
          const id = row.dataset.item;
          const field = input.dataset.field;
          const it = state.items.find(x => String(x.id) === String(id));
          it[field] = input.value;
          if(field === "name"){
            const matchedPrice = drugPriceMap[normalizeDrugName(input.value)];
            if(matchedPrice !== undefined){
              it.price = matchedPrice;
              const priceInput = row.querySelector('input[data-field="price"]');
              if(priceInput) priceInput.value = matchedPrice;
            }
          }
          const amountCell = row.children[5];
          amountCell.textContent = won((Number(it.qty)||0)*(Number(it.price)||0));
          const total = state.items.reduce((s,x)=> s + (Number(x.qty)||0)*(Number(x.price)||0), 0);
          const totalCell = document.querySelector("table.items tfoot .num");
          if(totalCell) totalCell.textContent = won(total) + " 원";
        });
      });
      const exportBtn = document.getElementById("export-excel");
      if(exportBtn) exportBtn.addEventListener("click", exportExcel);
    }
  }

  async function runBulkImport(){
    const m = state.bulkMapping;
    if(!m.name){ alert("약국명 열을 선택해 주세요."); return; }

    if(state.bulkReplaceAll){
      const sure = confirm(`정말로 기존에 등록된 약국 ${state.pharmacies.length}곳을 전부 삭제하고, 이 파일 내용으로 교체할까요?\n이 작업은 되돌릴 수 없습니다.`);
      if(!sure) return;
    }

    const existingNames = new Set(state.bulkReplaceAll ? [] : state.pharmacies.map(p => (p.name||"").trim()));
    const toWrite = [];
    let skipped = 0;
    state.bulkRows.forEach(r=>{
      const name = String(r[m.name]||"").trim();
      if(!name) return;
      if(!state.bulkReplaceAll && state.bulkSkipDup && existingNames.has(name)){ skipped++; return; }
      if(existingNames.has(name)) { skipped++; return; } // 파일 내부 중복 방지
      toWrite.push({
        name,
        phone: m.phone ? String(r[m.phone]||"").trim() : "",
        biz: m.biz ? String(r[m.biz]||"").trim() : "",
        ceo: m.ceo ? String(r[m.ceo]||"").trim() : "",
        address: m.address ? String(r[m.address]||"").trim() : ""
      });
      existingNames.add(name);
    });

    if(toWrite.length === 0){
      state.bulkStatus = `등록할 항목이 없습니다. (건너뜀 ${skipped}건)`;
      render();
      return;
    }

    const chunkSize = 400;

    if(state.bulkReplaceAll){
      state.bulkStatus = "기존 목록 삭제 중...";
      render();
      const existingIds = state.pharmacies.map(p => p.id);
      for(let i=0; i<existingIds.length; i+=chunkSize){
        const chunk = existingIds.slice(i, i+chunkSize);
        const batch = db.batch();
        chunk.forEach(id => batch.delete(db.collection("pharmacies").doc(id)));
        try{ await batch.commit(); }
        catch(e){ state.bulkStatus = "기존 목록 삭제 중 오류: " + e.message; render(); return; }
      }
    }

    state.bulkStatus = "등록 중...";
    render();

    let written = 0;
    for(let i=0; i<toWrite.length; i+=chunkSize){
      const chunk = toWrite.slice(i, i+chunkSize);
      const batch = db.batch();
      chunk.forEach(item=>{
        const ref = db.collection("pharmacies").doc();
        batch.set(ref, item);
      });
      try{
        await batch.commit();
        written += chunk.length;
      }catch(e){
        state.bulkStatus = `${written}건 등록 후 오류 발생: ${e.message}`;
        render();
        return;
      }
    }

    state.bulkStatus = state.bulkReplaceAll
      ? `전체 교체 완료: ${written.toLocaleString("ko-KR")}건 등록 (건너뜀 ${skipped}건)`
      : `${written.toLocaleString("ko-KR")}건 등록 완료 (건너뜀 ${skipped}건)`;
    state.bulkRows = [];
    state.bulkHeaders = [];
    state.bulkReplaceAll = false;
    render();
  }

  function exportExcel(){
    state.txError = "";
    const mine = state.pharmacies.find(p => p.id === state.myPharmacyId);
    const partner = state.pharmacies.find(p => p.id === state.selectedPartnerId);
    if(!mine){ state.txError = "먼저 '내 약국 설정'에서 우리 약국을 선택해 주세요."; render(); return; }
    if(!partner){ state.txError = "거래할 상대 약국을 선택해 주세요."; render(); return; }
    const isSupply = state.txType === "supply";
    const supplier = isSupply ? mine : partner;
    const receiver = isSupply ? partner : mine;
    const validItems = state.items.filter(it => it.name && it.name.trim());
    if(validItems.length === 0){ state.txError = "품목을 최소 1개 이상 입력해 주세요."; render(); return; }

    const rows = [];
    const idx = {};
    rows.push(["거래명세서","","","","","",""]);                                   idx.title = rows.length-1;
    rows.push([]);
    rows.push(["거래일자", state.txDate, "", "", "", "", ""]);                       idx.dateRow = rows.length-1;
    rows.push(["공급자","상호", supplier.name, "사업자등록번호", supplier.biz||"", "", ""]);   idx.supplierStart = rows.length-1;
    rows.push(["","대표자", supplier.ceo||"", "전화번호", supplier.phone||"", "", ""]);
    rows.push(["","주소", supplier.address||"", "", "", "", ""]);                    idx.supplierAddress = rows.length-1;
    rows.push([]);
    rows.push(["공급받는자","상호", receiver.name, "사업자등록번호", receiver.biz||"", "", ""]); idx.receiverStart = rows.length-1;
    rows.push(["","대표자", receiver.ceo||"", "전화번호", receiver.phone||"", "", ""]);
    rows.push(["","주소", receiver.address||"", "", "", "", ""]);                    idx.receiverAddress = rows.length-1;
    rows.push([]);
    rows.push(["번호","품목명","규격","수량","단가","공급가액","비고"]);              idx.itemHeader = rows.length-1;
    idx.itemStart = rows.length;
    validItems.forEach((it)=>{
      rows.push([rows.length-idx.itemStart+1, it.name, it.spec, Number(it.qty)||0, Number(it.price)||0, (Number(it.qty)||0)*(Number(it.price)||0), it.note||""]);
    });
    idx.itemEnd = rows.length-1;
    rows.push(["합계","","","","", validItems.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0), ""]); idx.totalRow = rows.length-1;
    if(state.txNote && state.txNote.trim()){
      rows.push([]);
      rows.push(["비고", state.txNote, "", "", "", "", ""]); idx.noteRow = rows.length-1;
    }

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!merges"] = [
      { s:{r:idx.title,c:0}, e:{r:idx.title,c:6} },
      { s:{r:idx.dateRow,c:1}, e:{r:idx.dateRow,c:6} },
      { s:{r:idx.supplierStart,c:0}, e:{r:idx.supplierAddress,c:0} },
      { s:{r:idx.supplierAddress,c:2}, e:{r:idx.supplierAddress,c:6} },
      { s:{r:idx.receiverStart,c:0}, e:{r:idx.receiverAddress,c:0} },
      { s:{r:idx.receiverAddress,c:2}, e:{r:idx.receiverAddress,c:6} },
      { s:{r:idx.totalRow,c:0}, e:{r:idx.totalRow,c:4} }
    ];
    if(idx.noteRow !== undefined){
      ws["!merges"].push({ s:{r:idx.noteRow,c:1}, e:{r:idx.noteRow,c:6} });
    }
    ws["!cols"] = [{wch:10},{wch:20},{wch:12},{wch:8},{wch:10},{wch:14},{wch:16}];

    const THIN = { style:"thin", color:{ rgb:"000000" } };
    const BOX = { top:THIN, bottom:THIN, left:THIN, right:THIN };
    function styleCell(r, c, extra){
      const ref = XLSX.utils.encode_cell({ r, c });
      if(!ws[ref]) ws[ref] = { t:"s", v:"" };
      ws[ref].s = Object.assign({}, ws[ref].s, extra);
    }
    const borderedRows = rows.map((row,i)=> row.length > 0 && i !== idx.title ? i : -1).filter(i=>i>=0);
    borderedRows.forEach(r=>{ for(let c=0;c<7;c++) styleCell(r, c, { border: BOX }); });

    styleCell(idx.title, 0, { font:{ bold:true, sz:14 }, alignment:{ horizontal:"center", vertical:"center" } });
    for(let c=0;c<7;c++) styleCell(idx.itemHeader, c, { font:{ bold:true }, alignment:{ horizontal:"center", vertical:"center" } });
    styleCell(idx.totalRow, 0, { font:{ bold:true } });
    styleCell(idx.dateRow, 0, { font:{ bold:true } });
    [idx.supplierStart, idx.supplierStart+1, idx.supplierAddress, idx.receiverStart, idx.receiverStart+1, idx.receiverAddress].forEach(r=>{
      styleCell(r, 0, { font:{ bold:true } });
      styleCell(r, 1, { font:{ bold:true } });
      styleCell(r, 3, { font:{ bold:true } });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "거래명세서");
    const wbout = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    const blob = new Blob([wbout], { type:"application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `거래명세서_${partner.name}_${state.txDate}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    render();
    const flash = document.getElementById("export-flash");
    if(flash){ flash.style.display = "inline"; setTimeout(()=>{ flash.style.display="none"; }, 1800); }
  }

  render();
}
</script>
