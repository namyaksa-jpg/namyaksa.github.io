<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공용 거래명세서 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #0f172a; }
    p.desc { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 8px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
    .tab-btn { padding: 10px 16px; border: none; background: none; font-size: 0.95rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }

    table.items { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.items th, table.items td { border: 1px solid #e2e8f0; padding: 8px 10px; font-size: 0.88rem; }
    table.items th { background: #f1f5f9; color: #334155; }
    table.items input { width: 100%; border: none; background: transparent; font-size: 0.88rem; }
    table.items input:focus { outline: 1px solid #2563eb; background: #fff; }
    .num { text-align: right; }

    .btn { padding: 8px 16px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; }
    .btn.primary { background: #2563eb; color: #fff; }
    .btn.secondary { background: #e2e8f0; color: #334155; }
    .btn-icon.danger { background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>공용 거래명세서 관리</h1>
  <p class="desc">참여 약사님들이 함께 쓰는 거래처 디렉토리입니다. 누군가 한 번 등록하면 모두가 바로 선택해서 쓸 수 있어요.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="directory">약국 디렉토리 (공용)</button>
    <button class="tab-btn" data-tab="my-setting">내 약국 설정</button>
    <button class="tab-btn" data-tab="transaction">거래명세서 작성</button>
  </div>

  <div id="app-content"></div>
</div>

<datalist id="drug-datalist"></datalist>

<script>
  function esc(str) {
    if (!str) return "";
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function won(val) {
    return (Number(val) || 0).toLocaleString("ko-KR");
  }

  function newItem() {
    return { id: Date.now() + Math.random(), name: "", spec: "", qty: "", price: "" };
  }

  let state = {
    activeTab: "directory",
    pharmacies: [
      { id: "p1", name: "파란약국", phone: "02-484-2479", biz: "212-17-8305", ceo: "남경호", address: "서울 강동구 양재대로 1325 101호" },
      { id: "p2", name: "백제약국", phone: "02-477-7900", biz: "468-38-0068", ceo: "조정규", address: "서울 강동구 성내동" }
    ],
    myPharmacyId: "p1",
    txDate: new Date().toISOString().slice(0, 10),
    txType: "supply",
    selectedPartnerId: "p2",
    items: [newItem()],
    txNote: "",
    txError: ""
  };

  function render() {
    const content = document.getElementById("app-content");
    
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });

    if (state.activeTab === "directory") {
      content.innerHTML = `
        <p style="color:#64748b; font-size:0.85rem;">등록된 약국 목록입니다.</p>
        <ul>${state.pharmacies.map(p => `<li><strong>${esc(p.name)}</strong> (${esc(p.phone)}) - ${esc(p.address)}</li>`).join("")}</ul>
      `;
    } else if (state.activeTab === "my-setting") {
      content.innerHTML = `
        <div class="field">
          <label>내 약국 선택</label>
          <select id="my-pharmacy-select">
            ${state.pharmacies.map(p => `<option value="${p.id}" ${p.id === state.myPharmacyId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
          </select>
        </div>
      `;
    } else if (state.activeTab === "transaction") {
      content.innerHTML = renderTransaction();
    }

    attachTabListeners();
  }

  function renderTransaction() {
    const mine = state.pharmacies.find(p => p.id === state.myPharmacyId);
    const partnerOptions = state.pharmacies.filter(p => p.id !== state.myPharmacyId);
    const partner = partnerOptions.find(p => p.id === state.selectedPartnerId);
    const total = state.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);

    if (!mine) return `<p class="empty-msg">먼저 '내 약국 설정' 탭에서 우리 약국을 선택해 주세요.</p>`;

    const isSupply = state.txType === "supply";
    const supplierPharm = isSupply ? mine : partner;
    const receiverPharm = isSupply ? partner : mine;

    const itemRows = state.items.map((it, idx) => `
      <tr data-item="${it.id}">
        <td>${idx + 1}</td>
        <td><input data-field="name" list="drug-datalist" autocomplete="off" value="${esc(it.name)}" placeholder="약품/물품명"></td>
        <td><input data-field="spec" value="${esc(it.spec)}"></td>
        <td><input data-field="qty" type="number" min="0" value="${it.qty}" style="text-align:right;"></td>
        <td><input data-field="price" type="number" min="0" value="${it.price}" style="text-align:right;"></td>
        <td class="num">${won((Number(it.qty) || 0) * (Number(it.price) || 0))}</td>
        <td style="text-align:center;"><button class="btn-icon danger" data-remove-item="${it.id}">X</button></td>
      </tr>
    `).join("");

    return `
      <div style="margin-bottom:14px; background:#f1f5f9; padding:10px 14px; border-radius:6px; display:flex; gap:18px; align-items:center;">
        <span style="font-size:0.85rem; font-weight:700;">거래 유형:</span>
        <label style="font-size:0.88rem; cursor:pointer;">
          <input type="radio" name="tx-type" value="supply" ${isSupply ? "checked" : ""}> 우리 약국이 공급 (매출/보냄)
        </label>
        <label style="font-size:0.88rem; cursor:pointer;">
          <input type="radio" name="tx-type" value="receive" ${!isSupply ? "checked" : ""}> 우리 약국이 공급받음 (매입/받음)
        </label>
      </div>

      <div class="partner-info" style="margin-bottom:16px;">
        공급자: <strong>${supplierPharm ? esc(supplierPharm.name) : "(선택 안 됨)"}</strong> 
        | 공급받는자: <strong>${receiverPharm ? esc(receiverPharm.name) : "(선택 안 됨)"}</strong>
      </div>

      <div class="grid2">
        <div class="field"><label>거래일자</label><input type="date" id="tx-date" value="${state.txDate}"></div>
        <div class="field">
          <label>상대 약국 (${isSupply ? "공급받는자" : "공급자"})</label>
          ${partnerOptions.length === 0
            ? `<p style="font-size:0.8rem; color:#94a3b8; border:1px dashed #cbd5e1; border-radius:6px; padding:8px 10px; margin:0;">디렉토리에 다른 약국이 아직 없습니다.</p>`
            : `<select id="tx-partner"><option value="">선택하세요</option>${partnerOptions.map(p => `<option value="${p.id}" ${p.id === state.selectedPartnerId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`}
        </div>
      </div>

      ${state.txError ? `<p class="error-msg" style="color:red; margin-top:10px;">${esc(state.txError)}</p>` : ""}

      <table class="items" style="margin-top:16px; width:100%; border-collapse:collapse;">
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th>품목명</th>
            <th style="width:100px;">규격</th>
            <th style="width:70px;">수량</th>
            <th style="width:90px;">단가</th>
            <th style="width:100px;">금액</th>
            <th style="width:50px;">삭제</th>
          </tr>
        </thead>
        <tbody>
          ${itemRows}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="5" style="text-align:right; font-weight:bold;">합계</td>
            <td class="num" style="font-weight:bold;">${won(total)} 원</td>
            <td></td>
          </tr>
        </tfoot>
      </table>

      <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
        <button class="btn secondary" id="add-item-row">+ 품목 추가</button>
        <button class="btn secondary" id="export-excel">엑셀 저장</button>
      </div>

      <div style="margin-top:16px;" class="field">
        <label>비고</label>
        <input type="text" id="tx-note" value="${esc(state.txNote || "")}" placeholder="비고 입력">
      </div>
    `;
  }

  function attachTabListeners() {
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        state.activeTab = btn.dataset.tab;
        render();
      };
    });

    if (state.activeTab === "my-setting") {
      const sel = document.getElementById("my-pharmacy-select");
      if (sel) {
        sel.onchange = (e) => {
          state.myPharmacyId = e.target.value;
          render();
        };
      }
    }

    if (state.activeTab === "transaction") {
      const partnerSel = document.getElementById("tx-partner");
      if (partnerSel) {
        partnerSel.onchange = (e) => {
          state.selectedPartnerId = e.target.value;
          render();
        };
      }

      document.querySelectorAll('input[name="tx-type"]').forEach(radio => {
        radio.onclick = (e) => {
          state.txType = e.target.value;
          render();
        };
      });

      const addBtn = document.getElementById("add-item-row");
      if (addBtn) {
        addBtn.onclick = () => {
          state.items.push(newItem());
          render();
        };
      }

      document.querySelectorAll('button[data-remove-item]').forEach(btn => {
        btn.onclick = (e) => {
          const id = e.target.dataset.removeItem;
          state.items = state.items.filter(it => String(it.id) !== String(id));
          if (state.items.length === 0) state.items.push(newItem());
          render();
        };
      });

      document.querySelectorAll('tr[data-item] input').forEach(input => {
        input.oninput = (e) => {
          const row = e.target.closest('tr');
          const id = row.dataset.item;
          const field = e.target.dataset.field;
          const item = state.items.find(x => String(x.id) === String(id));
          if (item) {
            item[field] = e.target.value;
            if (field === 'qty' || field === 'price') {
              const amountCell = row.children[5];
              amountCell.textContent = won((Number(item.qty) || 0) * (Number(item.price) || 0));
              const total = state.items.reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.price) || 0), 0);
              const totalCell = document.querySelector('table.items tfoot .num');
              if (totalCell) totalCell.textContent = won(total) + " 원";
            }
          }
        };
      });

      const exportBtn = document.getElementById("export-excel");
      if (exportBtn) exportBtn.onclick = exportExcel;
    }
  }

  function exportExcel() {
    state.txError = "";
    const mine = state.pharmacies.find(p => p.id === state.myPharmacyId);
    const partner = state.pharmacies.find(p => p.id === state.selectedPartnerId);

    if (!mine) { state.txError = "먼저 '내 약국 설정'에서 우리 약국을 선택해 주세요."; render(); return; }
    if (!partner) { state.txError = "거래할 상대 약국을 선택해 주세요."; render(); return; }

    const isSupply = state.txType === "supply";
    const supplier = isSupply ? mine : partner;
    const receiver = isSupply ? partner : mine;

    const validItems = state.items.filter(it => it.name && it.name.trim());
    if (validItems.length === 0) { state.txError = "품목을 최소 1개 이상 입력해 주세요."; render(); return; }

    const aoa = [
      ["거래명세서", "", "", "", "", "", ""],
      [],
      ["거래일자", state.txDate, "", "", "", "", ""],
      ["공급자", "상호", supplier.name, "사업자등록번호", supplier.biz || "", "", ""],
      ["", "대표자", supplier.ceo || "", "전화번호", supplier.phone || "", "", ""],
      ["", "주소", supplier.address || "", "", "", "", ""],
      [],
      ["공급받는자", "상호", receiver.name, "사업자등록번호", receiver.biz || "", "", ""],
      ["", "대표자", receiver.ceo || "", "전화번호", receiver.phone || "", "", ""],
      ["", "주소", receiver.address || "", "", "", "", ""],
      [],
      ["번호", "품목명", "규격", "수량", "단가", "공급가액", "비고"],
      ...validItems.map((it, idx) => [
        idx + 1,
        it.name || "",
        it.spec || "",
        Number(it.qty) || 0,
        Number(it.price) || 0,
        (Number(it.qty) || 0) * (Number(it.price) || 0),
        it.note || ""
      ]),
      ["합계", "", "", "", "", validItems.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0), ""]
    ];

    if (state.txNote && state.txNote.trim()) {
      aoa.push([]);
      aoa.push(["비고", state.txNote, "", "", "", "", ""]);
    }

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "거래명세서");
    XLSX.writeFile(wb, `거래명세서_${state.txDate}.xlsx`);
  }

  // 초기 실행
  render();
</script>

</body>
</html>
